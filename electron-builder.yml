# electron-builder config for the Windows desktop build (NSIS + portable).
# The app version is NOT read from package.json (0.1.1 is the upstream
# baseline, not the app version): pass it at build time, e.g.
#   pnpm exec electron-builder --config.extraMetadata.version=1.1.5 --win --x64
# so artifacts are named deepseek-for-chat-1.1.5-setup.exe /
# deepseek-for-chat-1.1.5-portable.exe. Build is UNSIGNED (no certificate):
# Windows SmartScreen will warn on first run.
appId: com.tsing.deepseekforchat
productName: deepseek for chat
directories:
  output: dist-electron
files:
  - dist/**
  - electron/**
  - package.json
win:
  icon: electron/assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: deepseek-for-chat-${version}-setup.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: deepseek for chat
portable:
  artifactName: deepseek-for-chat-${version}-portable.${ext}
